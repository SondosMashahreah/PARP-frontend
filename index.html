<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/components/Header/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0914" />
    <meta name="description" content="PARP — المنصة الفلسطينية للبحوث الإجرائية" />
    <title>PARP | المنصة الفلسطينية للبحوث الإجرائية</title>
    <script>
      (() => {
        try {
          const language = localStorage.getItem('parp-language') === 'en' ? 'en' : 'ar'
          document.documentElement.lang = language
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
          if (language === 'en') {
            document.title = 'PARP | Palestinian Action Research Platform'
            document.querySelector('meta[name="description"]')?.setAttribute('content', 'PARP — Palestinian Action Research Platform')
          }
        } catch {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
